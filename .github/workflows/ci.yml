name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  typescript:
    name: TypeScript build + parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install TS deps
        working-directory: packages/typescript
        run: npm ci --workspaces=false
      - name: Build TS package
        working-directory: packages/typescript
        run: npm run build --workspaces=false
      - name: Run TS parity tests
        run: node --test tests/contract_parity.test.mjs tests/autonomous_agent_parity.test.mjs

  python:
    name: Python Pydantic + parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/python
          pip install pytest
      - name: Run Python parity tests
        run: python -m pytest tests/contract_parity_test.py -v

  schema-validation:
    name: JSON Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate canonical schemas parse as JSON Schema 2020-12
        run: >-
          npm exec --yes
          --package=ajv-cli@5.0.0
          --package=ajv-formats@3.0.1
          --
          ajv compile
          -s "schemas/**/*.schema.json"
          --spec=draft2020
          --strict=false
          -c ajv-formats
      - name: Validate Python embedded schemas match canonical
        run: |
          set -e
          for canonical in $(find schemas -name "*.schema.json"); do
            embedded="packages/python/aillium_schemas/${canonical}"
            if [ -f "$embedded" ]; then
              if ! diff -q "$canonical" "$embedded" > /dev/null; then
                echo "DRIFT: $canonical differs from $embedded"
                diff "$canonical" "$embedded" || true
                exit 1
              fi
            fi
          done
